apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-async
  namespace: scaling-study
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastapi-async }
  template:
    metadata:
      labels: { app: fastapi-async }
    spec:
      containers:
        - name: fastapi-async
          image: scaling-blocking-io-fastapi-async:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: THIRD_PARTY_URL, value: "http://mock-third-party:9000/delay" }
            # Matches django-uwsgi's 2x15=30 slot budget: 2 workers x 15 limit-concurrency.
            - { name: WORKERS, value: "2" }
            - { name: LIMIT_CONCURRENCY, value: "15" }
          resources:
            requests: { cpu: 300m, memory: 128Mi }
            limits: { cpu: 800m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-async
  namespace: scaling-study
spec:
  type: NodePort
  selector: { app: fastapi-async }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
