apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-uwsgi
  namespace: scaling-study
spec:
  replicas: 1
  selector:
    matchLabels: { app: django-uwsgi }
  template:
    metadata:
      labels: { app: django-uwsgi }
    spec:
      containers:
        - name: django-uwsgi
          image: scaling-blocking-io-django-uwsgi:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
            - { containerPort: 9191, name: stats }
          env:
            - { name: THIRD_PARTY_URL, value: "http://mock-third-party:9000/delay" }
            # Sweep knobs — this is the axis the whole study is about.
            # Scaled down from the local 4x25 test to fit this cluster's
            # budget; bump for real sweep runs.
            - { name: WORKERS, value: "2" }
            - { name: THREADS, value: "15" }
            - { name: THUNDER_LOCK, value: "false" }
          resources:
            requests: { cpu: 300m, memory: 256Mi }
            limits: { cpu: 800m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
        # Sidecar: translates uwsgi's native JSON stats (port 9191) into
        # Prometheus format, notably listen_queue / listen_queue_errors —
        # the exact counters needed to settle the Phase 1 open question
        # (is "unreachable" real backlog rejection, or a client-timeout
        # artifact?) with a live time series instead of a one-off curl.
        - name: uwsgi-exporter
          image: timonwong/uwsgi-exporter:latest
          args:
            - --stats.uri=http://localhost:9191
          ports:
            - { containerPort: 9117, name: uwsgi-exp }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: django-uwsgi
  namespace: scaling-study
spec:
  type: NodePort
  selector: { app: django-uwsgi }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
    - { name: stats, port: 9191, targetPort: 9191 }
    - { name: uwsgi-exp, port: 9117, targetPort: 9117 }
